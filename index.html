<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Interactive Rating Component</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="main-content">

    <div class="container">

      <section
        class="card"
        id="rating-card"
        aria-labelledby="rating-title"
      >

        <div class="star" aria-hidden="true">
          ★
        </div>

        <h1 id="rating-title">
          How did we do?
        </h1>

        <p>
          Please let us know how we did with your support request.
          All feedback is appreciated to help us improve our offering!
        </p>

        <div class="ratings">

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 1"
          >
            1
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 2"
          >
            2
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 3"
          >
            3
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 4"
          >
            4
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 5"
          >
            5
          </button>

        </div>

        <button
          type="button"
          class="submit-btn"
          id="submit-btn"
        >
          SUBMIT
        </button>

      </section>

      <section
        class="card thank-you hidden"
        id="thank-you-card"
        aria-labelledby="thank-you-title"
      >

        <div
          class="selected-rating"
          id="selected-rating"
        >
          You selected 0 out of 5
        </div>

        <h2 id="thank-you-title">
          Thank you!
        </h2>

        <p>
          We appreciate you taking the time to give a rating.
          If you ever need more support,
          don’t hesitate to get in touch!
        </p>

      </section>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
