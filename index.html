<body>

  <main class="main-content">

    <div class="container">

      <section
        class="card"
        id="rating-card"
        aria-labelledby="rating-title"
      >

        <div class="star" aria-hidden="true">
          ★
        </div>

        <h1 id="rating-title">
          How did we do?
        </h1>

        <p>
          Please let us know how we did with your support request.
          All feedback is appreciated to help us improve our offering!
        </p>

        <div class="ratings">

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 1"
          >
            1
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 2"
          >
            2
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 3"
          >
            3
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 4"
          >
            4
          </button>

          <button
            type="button"
            class="rating-btn"
            aria-label="Rate 5"
          >
            5
          </button>

        </div>

        <button
          type="button"
          class="submit-btn"
          id="submit-btn"
        >
          SUBMIT
        </button>

      </section>

    </div>

  </main>

</body>
